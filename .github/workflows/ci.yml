name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src skills tests examples
      - run: python -m pytest -q
      - name: skill entry points run on a clean interpreter
        run: |
          python -I skills/yt-edit/deadair.py tests/fixtures/sample_array.json --json > /dev/null
          python -I skills/yt-chapters/chapters.py tests/fixtures/sample.vtt > /dev/null
          python -I skills/yt-script/hookscore.py tests/fixtures/hooks.txt > /dev/null
